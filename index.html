<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デザイン 2026年9月</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #FFFFFF;
    --group: rgba(147, 147, 147, .12);
    --tile: #FFFFFF;
    --tile-line: #E4E6E8;
    --line: #E7E8EA;
    --ink: #24282C;
    --ink-mid: #6B7278;
    --ink-soft: #9AA0A6;
    --tile-shadow: 0 1px 2px rgba(24,28,32,.07);
    /* a wider, softer lift for the article cards */
    --card-shadow: 0 2px 4px rgba(24,28,32,.05), 0 10px 24px -8px rgba(24,28,32,.14);
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    --display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    --body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FFFFFF;
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 808px;
    margin: 0 auto;
    padding-inline: 24px;
    padding-block: 24px 48px;
  }

  /* ---------- header ---------- */
  .hd {
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: nowrap;
  }
  .hd h1 {
    flex: 0 0 auto;
    font-family: var(--display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: .01em;
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  /* the tab strip stays on one line however many 号 there are:
     it shrinks, then scrolls sideways instead of wrapping */
  .issues {
    display: flex;
    gap: 4px;
    flex: 1 1 auto;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .issues::-webkit-scrollbar { display: none; }
  .issues button {
    flex: 0 0 auto;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .04em;
    padding: 4px 10px;
    border: 1px solid transparent;
    border-radius: 99px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .issues button:hover:not(:disabled):not([aria-current="true"]) {
    color: var(--ink);
    border-color: var(--tile-line);
  }
  .issues button[aria-current="true"] {
    background: var(--group);
    color: var(--ink);
  }
  .issues button:disabled { opacity: .45; cursor: default; }
  .issues button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .hd .sub {
    flex: 0 0 auto;
    margin: 0 0 0 auto;
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* ---------- board ---------- */
  .board {
    margin-top: 28px;
  }
  .group {
    background: var(--group);
    border-radius: 12px;
    padding: 16px;
    display: grid;
    gap: 16px;
  }
  .group-hd h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    margin: 0 0 3px;
    letter-spacing: .01em;
  }
  .group-hd .desc { font-size: 11px; color: var(--ink-soft); line-height: 1.55; }

  .subgroup {
    /* same 12% grey as the parent panel — stacking it reads as the darker, inner layer */
    background: var(--group);
    border-radius: 10px;
    padding: 16px;
    display: grid;
    gap: 12px;
  }
  .sub-hd h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 13px;
    margin: 0 0 2px;
    letter-spacing: .01em;
  }
  .sub-hd .desc { font-size: 10.5px; color: var(--ink-soft); line-height: 1.5; }
  .content {
    padding: 16px;
    display: grid;
    gap: 12px;
  }
  /* the outermost level (デジタルプロダクトデザイン) sits a step wider */
  .group > .content { padding: 16px 32px; }
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 9px;
  }
  .tile {
    position: relative;
    background: var(--tile);
    border: 1px solid var(--tile-line);
    border-radius: 9px;
    box-shadow: var(--tile-shadow);
    min-height: 62px;
    padding: 11px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    text-align: center;
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s, transform .12s;
  }
  .tile:hover { border-color: var(--ink-mid); }
  .tile:active { transform: translateY(1px); }
  .tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .tile.is-sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .tile .t,
  .tile .s {
    font-family: var(--display);
    font-weight: 500;
    font-size: 12.5px;
    line-height: 1.4;
    letter-spacing: .01em;
    color: var(--ink);
  }
  .tile .n {
    position: absolute;
    top: 6px;
    right: 8px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- article list view ---------- */
  .list { margin-top: 24px; }
  .back {
    font-family: var(--body);
    font-size: 12px;
    border: 0;
    background: transparent;
    color: var(--ink-mid);
    padding: 0;
    cursor: pointer;
  }
  .back:hover { color: var(--ink); }
  .back:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .list-hd { margin: 12px 0 18px; }
  .list-hd .crumb {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .06em;
    color: var(--ink-soft);
  }
  .list-hd h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 22px;
    margin: 2px 0 0;
    letter-spacing: .01em;
  }

  .articles { margin-top: 16px; display: grid; gap: 8px; }
  .article {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: start;
    gap: 12px;
    background: var(--tile);
    border: 1px solid var(--tile-line);
    border-radius: 10px;
    box-shadow: var(--card-shadow);
    padding: 13px 14px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color .15s;
  }
  .article:hover { border-color: var(--ink-mid); }
  /* a note with no link is not clickable */
  .article.no-link { box-shadow: none; background: var(--group); }
  .article.no-link:hover { border-color: var(--tile-line); }
  .article:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .article .at {
    font-family: var(--display);
    font-weight: 500;
    font-size: 13.5px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .article .ad {
    white-space: pre-line;
    font-size: 12px;
    color: var(--ink-mid);
    line-height: 1.65;
    margin: 2px 0 4px;
  }
  .article .au {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }
  .article .go { font-size: 12px; color: var(--ink-soft); }
  .empty {
    border: 1px dashed rgba(147, 147, 147, .45);
    border-radius: 10px;
    padding: 22px 16px;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .foot {
    margin-top: 22px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .foot kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 4px;
    margin: 0 1px;
    color: var(--ink-mid);
    background: var(--group);
  }

  @media (max-width: 560px) {
    .hd { flex-wrap: wrap; }
    .hd .sub { margin-left: 0; order: 3; flex-basis: 100%; }
  }
  @media (max-width: 480px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hd">
    <h1>デザイン</h1>
    <nav class="issues" id="issues" aria-label="号を選ぶ"></nav>
    <p class="sub">Claudeから手動更新</p>
  </header>

  <section class="board" id="board"></section>

  <section class="list" id="list" hidden>
    <button class="back" id="back" type="button">← 一覧に戻る</button>
    <div class="list-hd">
      <div class="crumb" id="crumb"></div>
      <h2 id="list-title"></h2>
    </div>

    <div class="articles" id="articles"></div>
  </section>

  <div class="foot" id="foot">
    タイルをクリック、または <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> で選択。<kbd>Enter</kbd> で記事一覧を開きます。
  </div>
</div>

<script>
(function () {
  "use strict";

  var ROOT = {
    id: "pd",
    name: "デジタルプロダクトデザイン",
    desc: "データ分析・リサーチ・KPI・継続率改善を含む",
    sub: {
      id: "ux",
      name: "UXデザイン",
      desc: "ユーザー体験の設計・Why / What / How",
      sub: {
        id: "ui",
        name: "UIデザイン",
        desc: "視覚・操作インターフェースの設計：How",
        items: [
          // keeps the "hig" id so links already added under it stay attached
          { id: "hig", t: "インタラクション" },
          { id: "da", t: "デジタル庁・WCAG" },
          { id: "trend", t: "スタイルトレンド" },
          { id: "nav", t: "ナビゲーション", s: "レイアウト" },
          { id: "ds", t: "デザインシステム" }
        ]
      },
      items: [
        { id: "modeling", t: "ユーザー", s: "モデリング" },
        { id: "explore", t: "探索的", s: "検証" },
        { id: "hypo", t: "仮説検証", s: "調査" },
        { id: "domain", t: "ドメイン", s: "知識" },
        { id: "deep", t: "体験の", s: "深掘り" }
      ]
    },
    items: [
      { id: "quant", t: "定量調査", s: "施策紐付" },
      { id: "translate", t: "ユーザー行動の", s: "定量的な翻訳" },
      { id: "biz", t: "事業成果", s: "仮説検証型" },
      { id: "impact", t: "インパクト試算" }
    ]
  };

  var ITEMS = {};
  (function collect(g) {
    g.items.forEach(function (it) {
      it.area = g.name;
      it.label = it.t + (it.s || "");
      ITEMS[it.id] = it;
    });
    if (g.sub) collect(g.sub);
  })(ROOT);

  var selected = ROOT.sub.sub.items[0].id;
  var openSkill = null;

  var board = document.getElementById("board");
  var listView = document.getElementById("list");
  var articlesEl = document.getElementById("articles");
  var foot = document.getElementById("foot");

  /* ---------- issues ----------
     Newest first: a new 号 goes at the TOP of this array and becomes the one
     shown on load as soon as its `enabled` is true. A 号 with enabled: false
     appears in the tab strip but cannot be opened yet.
     Inside `links`, put a new article at the TOP of its skill's array:
       hig: [{ url: "https://example.com/a", title: "記事タイトル", desc: "説明（改行可）" }]
     Skill keys — UI: hig, da, trend, nav, ds /
     UX: modeling, explore, hypo, domain, deep /
     デジタルプロダクトデザイン: quant, translate, biz, impact */
  var ISSUES = [
    {
      id: "2026-10",
      label: "2026年10月",
      enabled: false,
      links: {}
    },
    {
      id: "2026-09",
      label: "2026年9月",
      enabled: true,
      links: {
    hig: [
      {
        url: "https://note.com/qlouni2/n/na831b10a5025?app_launch=false",
        title: "意図的なフリクション",
        desc: "誤操作の防止やセキュリティ確認、ユーザーの学習促進のために、あえて行動を止めさせる設計。\nAIによる自動化や、シームレスになりすぎたUXに警鐘をならす記事がweb上に増えた。"
      },
      {
        url: "https://developer.android.com/design/ui/mobile/guides/patterns/predictive-back?utm_source=gemini&hl=ja",
        title: "予測バックジェスチャー",
        desc: "Predictive Back（予測バックジェスチャー）の完全定着"
      }
    ],
    da: [
      {
        url: "https://developer.apple.com/design/human-interface-guidelines/layout#Size-classes",
        title: "ダイナミックタイプ（iOS）",
        desc: "OSに搭載されているシステムレベルの機能"
      },
      {
        url: "https://goodpatch.com/blog/learn-wcag#3",
        title: "アクセシビリティ（WCAG 2.2）の完全標準化",
        desc: "単なる「色覚多様性対応」を超え、フォーカス領域の視認性、ドラッグ操作の代替、最小タップターゲット領域の徹底など、国際規格に基づくUI設計がプロダクトの必須要件となった。"
      }
    ],
    trend: [
      {
        url: "https://dribbble.com/search/tactile-ui?utm_source=gemini",
        title: "Soft Tactile（ソフト・タクタイル）＝柔らかな触覚",
        desc: "従来のフラットやネオブルータリズムの強い境界線から、物理的・触覚的な質感、微細なグラデーション、柔らかな影を感じさせる、親しみやすく目に優しい質感デザインに回帰。"
      },
      {
        url: "https://developer.apple.com/design/human-interface-guidelines/branding#Best-practices",
        title: "ブランド表現（iOS）",
        desc: "・非推奨：コントロールに色を使うこと\n・推奨：カスタムフォントの使用"
      }
    ],
    nav: [
      {
        url: "https://m3.material.io/foundations/layout/layout-overview/overview",
        title: "順応型レイアウト（Android）",
        desc: "折りたたみ端末、タブレット、車載用UIなど、各種画面サイズや端末の変形に動的に応じる「Adaptive/Dynamic Layout」のコンポーネント設計が標準化。"
      },
      {
        url: "https://developer.apple.com/design/human-interface-guidelines/layout#Size-classes",
        title: "レイアウト（iOS）",
        desc: "・推奨：幅広い端末への対応（サイズクラスの使用）"
      }
    ],
    ds: [
      {
        url: "https://qiita.com/Takenoko4594/items/4387782ff8310427048e",
        title: "Generative UI",
        desc: "デザインシステムにも「AI生成UI用のガイドラインやトークン定義」を取り入れる動きが加速しています。"
      }
    ],
    modeling: [
      {
        title: "暫定ペルソナの社内共有",
        desc: "リニューアルが誰のために行われたのか？\nどんな人が、どのように反応すれば成功と言えるのかUXの切り口で定義する。"
      }
    ],
    explore: [
      {
        title: "アンケートの実施",
        desc: "一部ユーザーへの公開・α版リリースに対する意見を広く回収する予定。\n優先度を明確にして、チームで対応する必要がある。"
      }
    ],
    hypo: [
      {
        title: "インタビュー計画",
        desc: "設計の元になった仮説をまとめ、リリース後の検証計画を立てる。\n\nアクションプランの先行策定：「仮説が正しかった場合（YES/NO）」に実行する具体的なUI・UXデザイン改善策をあらかじめ用意した上でリサーチを行う。\n\nスコープの絞り込み：1回のインタビューで検証する仮説は3〜4つ程度に抑え、特定の機能やジャーニーに焦点を当てる。"
      }
    ],
    domain: [],
    deep: [],
    quant: [
      {
        title: "定量監視",
        desc: "既存・新規の指標を洗い出し、監視する仕組みを準備する。"
      },
      {
        title: "過去の施策と定量指標の紐付",
        desc: "過去実施した施策と定量指標を一覧化する。"
      }
    ],
    translate: [
      {
        title: "未着手",
        desc: "ユーザー行動の数値的定義：「記事を読む＝スクロール率75%以上＋滞在時間2分以上」のように、行動をログデータに翻訳します。\n\nThe Aha Moment（コアバリュー体験）の特定：初回利用時などにユーザーが価値を感じる一連の連続行動を条件化して計測します。"
      }
    ],
    biz: [],
    impact: [
      {
        title: "未着手",
        desc: "ビジネスインパクト ＝ 対象ユーザー規模 × 売上寄与度 × 見込まれる改善率"
      }
    ]
  }
    }
  ];

  var issue = ISSUES.filter(function (x) { return x.enabled; })[0] || ISSUES[0];

  function linksFor(skill) {
    return (issue.links && issue.links[skill]) || [];
  }

  /* ---------- board ---------- */
  function tileGrid(items) {
    var grid = document.createElement("div");
    grid.className = "tiles";
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tile";
      b.id = "tile-" + it.id;
      b.dataset.id = it.id;
      b.innerHTML = '<span class="n" id="count-' + it.id + '"></span>' +
        '<span class="t">' + it.t + "</span>" +
        (it.s ? '<span class="s">' + it.s + "</span>" : "");
      b.addEventListener("click", function () {
        selected = it.id;
        markSelection();
        openList(it.id);
      });
      grid.appendChild(b);
    });
    return grid;
  }

  function heading(name, desc, cls) {
    var hd = document.createElement("div");
    hd.className = cls;
    hd.innerHTML = "<h2>" + name + "</h2>" + '<div class="desc">' + desc + "</div>";
    return hd;
  }

  // Each level renders its nested block first, then its own heading and tiles,
  // so the innermost area (UI) sits at the top of the stack it belongs to.
  function renderGroup(g, depth) {
    var box = document.createElement(depth === 0 ? "section" : "div");
    box.className = depth === 0 ? "group" : "subgroup";

    var own = box;
    if (g.sub) {
      box.appendChild(renderGroup(g.sub, depth + 1));
      // a level that wraps another one keeps its own heading and tiles in a padded block
      own = document.createElement("div");
      own.className = "content";
      box.appendChild(own);
    }
    own.appendChild(heading(g.name, g.desc, depth === 0 ? "group-hd" : "sub-hd"));
    own.appendChild(tileGrid(g.items));
    return box;
  }

  board.appendChild(renderGroup(ROOT, 0));

  function markSelection() {
    Array.prototype.forEach.call(document.querySelectorAll(".tile"), function (t) {
      var on = t.dataset.id === selected;
      t.classList.toggle("is-sel", on);
      t.tabIndex = on ? 0 : -1;
      t.setAttribute("aria-current", on ? "true" : "false");
    });
  }

  function setCount(skill, n) {
    var el = document.getElementById("count-" + skill);
    if (el) el.textContent = n > 0 ? n : "";
  }

  /* ---------- article list ---------- */
  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; }
  }

  function renderArticles(rows) {
    articlesEl.textContent = "";

    if (!rows.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "このスキルのリンクはまだ登録されていません。";
      articlesEl.appendChild(empty);
      return;
    }

    rows.forEach(function (r) {
      var a;
      if (r.url) {
        a = document.createElement("a");
        a.href = r.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      } else {
        a = document.createElement("div");
        a.className = "no-link";
      }
      a.className = "article" + (r.url ? "" : " no-link");

      var left = document.createElement("div");
      var t = document.createElement("div");
      t.className = "at";
      t.textContent = r.title || hostOf(r.url);
      left.appendChild(t);

      if (r.desc) {
        var d = document.createElement("div");
        d.className = "ad";
        d.textContent = r.desc;
        left.appendChild(d);
      }

      if (r.url) {
        var u = document.createElement("div");
        u.className = "au";
        u.textContent = r.url;
        left.appendChild(u);
      }

      a.appendChild(left);

      if (r.url) {
        var go = document.createElement("span");
        go.className = "go";
        go.textContent = "開く ↗";
        a.appendChild(go);
      }

      articlesEl.appendChild(a);
    });
  }

  function openList(skill) {
    openSkill = skill;
    var it = ITEMS[skill];
    document.getElementById("crumb").textContent = it.area;
    document.getElementById("list-title").textContent = it.label;
    board.hidden = true;
    listView.hidden = false;
    foot.innerHTML = "記事をクリックするとリンクが新しいタブで開きます。<kbd>Esc</kbd> で一覧に戻ります。";
    renderArticles(linksFor(skill));
    document.getElementById("back").focus();
  }

  function closeList() {
    openSkill = null;
    listView.hidden = true;
    board.hidden = false;
    foot.innerHTML = "タイルをクリック、または <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> で選択。<kbd>Enter</kbd> で記事一覧を開きます。";
    focusTile(document.getElementById("tile-" + selected));
  }

  document.getElementById("back").addEventListener("click", closeList);

  /* ---------- keyboard ---------- */
  function focusTile(el) {
    if (!el) return;
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    if (el.scrollIntoView) el.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function moveSelection(dir) {
    var cur = document.getElementById("tile-" + selected);
    if (!cur) return;
    var r = cur.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var best = null, bestScore = Infinity;

    Array.prototype.forEach.call(document.querySelectorAll(".tile"), function (t) {
      if (t === cur) return;
      var b = t.getBoundingClientRect();
      var dx = (b.left + b.width / 2) - cx;
      var dy = (b.top + b.height / 2) - cy;
      var main, cross;
      if (dir === "left")       { if (dx > -4) return; main = -dx; cross = Math.abs(dy); }
      else if (dir === "right") { if (dx <  4) return; main =  dx; cross = Math.abs(dy); }
      else if (dir === "up")    { if (dy > -4) return; main = -dy; cross = Math.abs(dx); }
      else                      { if (dy <  4) return; main =  dy; cross = Math.abs(dx); }
      var score = main + cross * 2.2;
      if (score < bestScore) { bestScore = score; best = t; }
    });

    if (!best) return;
    selected = best.dataset.id;
    markSelection();
    focusTile(best);
  }

  function grabKeyboard() {
    if (openSkill) return;
    var a = document.activeElement;
    if (a && a.classList && a.classList.contains("tile")) return;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")) return;
    focusTile(document.getElementById("tile-" + selected));
  }

  // The page often runs in a side pane that does not hold keyboard focus yet:
  // take it as soon as the pointer is over the board, or on any click in the page.
  board.addEventListener("mouseenter", grabKeyboard, true);
  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest("a, input, button")) return;
    grabKeyboard();
  });

  var DIRS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var a = document.activeElement;
    var typing = a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT" || a.isContentEditable);

    if (e.key === "Escape" && openSkill) {
      if (typing) a.blur();
      closeList();
      return;
    }
    if (typing || openSkill) return;

    var dir = DIRS[e.key];
    if (!dir) return;
    e.preventDefault();

    var inTile = a && a.classList && a.classList.contains("tile");
    if (!inTile) focusTile(document.getElementById("tile-" + selected));
    moveSelection(dir);
  });

  markSelection();

  /* ---------- issue tabs ---------- */
  function refreshCounts() {
    Object.keys(ITEMS).forEach(function (id) {
      setCount(id, linksFor(id).length);
    });
  }

  var issuesEl = document.getElementById("issues");
  ISSUES.forEach(function (x) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = x.label;
    b.disabled = !x.enabled;
    b.setAttribute("aria-current", String(x === issue));
    if (!x.enabled) b.title = "準備中";
    b.addEventListener("click", function () {
      if (x === issue) return;
      issue = x;
      if (openSkill) closeList();
      Array.prototype.forEach.call(issuesEl.children, function (el) {
        el.setAttribute("aria-current", String(el === b));
      });
      refreshCounts();
    });
    issuesEl.appendChild(b);
    if (x === issue && b.scrollIntoView) {
      b.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  });

  refreshCounts();

})();
</script>
</body>
</html>
